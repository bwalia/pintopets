# ── PintoPets — PRODUCTION (template) ──────────────────────────────────────
# NOT deployed by anything yet. Copy to values-prod.yaml once the owner has
# confirmed every <CONFIRM: …> value below; App Store builds must point at this
# host (apps/ios: PINTOPETS_API_URL, see apps/ios/APP_STORE.md).
#
# Unlike int, prod must be PUBLIC (no Workstation VPN access profile): App
# Review and customers reach it from the internet. It must serve /privacy,
# /terms, /support and /account/delete.
env: prod
host: "<CONFIRM: public host, e.g. the apex domain the owner chooses>"

# Real sign-in only; env() refuses DEMO_AUTH on prod.
demoAuth: false
# Turn on after OpsAPI prod has APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY,
# APPLE_CLIENT_ID (Services ID) and APPLE_REDIRECT_URI
# (https://<opsapi public host>/auth/apple/callback). Required for App Review.
appleSignIn: false
community:
  moderatorEmails: [] # <CONFIRM: moderator sign-in emails>

opsapi:
  url: "<CONFIRM: in-cluster OpsAPI URL for prod>"
  publicUrl: "<CONFIRM: public OpsAPI URL used for hosted sign-in>"
  namespace: pintopets
  apiKeySecret: pintopets-opsapi
