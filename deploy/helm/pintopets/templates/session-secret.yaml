{{- /*
  Signs the PintoPets session cookie. Generated once, on first install, and
  reused on every upgrade (lookup reads the live Secret), so sign-ins survive
  deploys. Rotating it (delete the Secret, redeploy) signs everyone out.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "pintopets-session" }}
{{- $secret := "" }}
{{- if and $existing $existing.data (index $existing.data "SESSION_SECRET") }}
{{- $secret = index $existing.data "SESSION_SECRET" | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pintopets-session
  labels:
    {{- include "pintopets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  SESSION_SECRET: {{ $secret | b64enc | quote }}
