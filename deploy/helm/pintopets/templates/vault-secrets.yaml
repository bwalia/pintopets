{{- /*
  App credentials come from WSL Vault through ESO. Keys under each Vault path
  become keys of the Secret pintopets-<name>. deletionPolicy Retain keeps the
  Secret if an entry is removed, so pods keep running until someone deletes it
  on purpose.
*/}}
{{- range $name, $key := .Values.vaultSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pintopets-{{ $name }}
  labels:
    {{- include "pintopets.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.vaultStore }}
  target:
    name: pintopets-{{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ $key }}
{{- end }}
