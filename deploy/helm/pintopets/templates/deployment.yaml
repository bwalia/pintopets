apiVersion: apps/v1
kind: Deployment
metadata:
  name: pintopets
  labels:
    {{- include "pintopets.labels" . | nindent 4 }}
    {{- include "pintopets.selector" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.media.persistence.enabled }}
    # The photos volume is ReadWriteOnce: the old pod must let go first.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      {{- include "pintopets.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pintopets.labels" . | nindent 8 }}
        {{- include "pintopets.selector" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        # Makes the photos volume writable by the app user.
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: APP_ENV
              value: {{ .Values.env | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: APP_URL
              value: {{ printf "https://%s" .Values.host | quote }}
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: DEMO_AUTH
              value: {{ .Values.demoAuth | quote }}
            - name: MEDIA_DIR
              value: {{ .Values.media.mountPath | quote }}
            - name: OPSAPI_URL
              value: {{ .Values.opsapi.url | quote }}
            - name: OPSAPI_PUBLIC_URL
              value: {{ .Values.opsapi.publicUrl | quote }}
            - name: OPSAPI_NAMESPACE
              value: {{ .Values.opsapi.namespace | quote }}
            - name: OPSAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opsapi.apiKeySecret }}
                  key: OPSAPI_API_KEY
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pintopets-session
                  key: SESSION_SECRET
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.vaultSecrets }}
          envFrom:
            {{- range $name, $path := . }}
            - secretRef:
                name: pintopets-{{ $name }}
                optional: true
            {{- end }}
          {{- end }}
          # Ready only when OpsAPI answers (the health endpoint returns 503
          # otherwise). Liveness is a plain TCP check so an OpsAPI outage does
          # not restart-loop the web pods.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- if .Values.media.persistence.enabled }}
          volumeMounts:
            - name: media
              mountPath: {{ .Values.media.mountPath }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.media.persistence.enabled }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: pintopets-media
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: pintopets
  labels:
    {{- include "pintopets.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "pintopets.selector" . | nindent 4 }}
