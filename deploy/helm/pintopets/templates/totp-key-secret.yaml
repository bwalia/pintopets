{{- /*
  AES-256-GCM key for the TOTP secrets PintoPets stores (encrypted) in OpsAPI.
  32 random bytes, generated once and kept forever: losing or changing it
  makes every enrolled authenticator unusable (users would need recovery codes
  and to set 2FA up again). resource-policy keep: survives uninstall.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "pintopets-totp" }}
{{- $key := "" }}
{{- if and $existing $existing.data (index $existing.data "TOTP_ENCRYPTION_KEY") }}
{{- $key = index $existing.data "TOTP_ENCRYPTION_KEY" | b64dec }}
{{- else }}
{{- $key = randBytes 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pintopets-totp
  labels:
    {{- include "pintopets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  TOTP_ENCRYPTION_KEY: {{ $key | b64enc | quote }}
