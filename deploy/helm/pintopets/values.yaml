# Base defaults for the PintoPets chart. Per-ring overlays: values-<ring>.yaml.
# Installed as release `pintopets` into the shared ring namespaces
# (int/test/acc/prod), like workerra and closeknitty.
#
# No credential is ever set here (the repo is public). Pet data lives in OpsAPI
# (opsapi/pintopets plugin); the session secret is generated in-cluster
# (templates/session-secret.yaml); the OpsAPI key is a Secret created out of band.

# Ring name, passed to the app as APP_ENV (local|int|test|acc|prod).
env: int
# Public host. Single source of truth for the deploy workflow's DNS and edge
# jobs, which read it with awk: keep it a plain top-level `host: <fqdn>` line.
host: int.pintopets.app

image:
  repository: harneetk78/pintopets
  # Set by the deploy workflow: --set image.tag=<short sha>. Also exported as
  # APP_VERSION, which /api/v1/health reports and Ring Promoter verifies.
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
port: 3000

# PintoPets' data API and sign-in: OpsAPI with the `pintopets` plugin
# (opsapi/pintopets, loaded into OpsAPI as a plugin overlay image).
opsapi:
  # Server to server (in-cluster).
  url: http://workstation-opsapi.int.svc.cluster.local
  # As the browser sees it, for the hosted sign-in page.
  publicUrl: https://int-opsapi.workstation.co.uk
  namespace: pintopets
  # Secret holding OPSAPI_API_KEY (an opsk_ key scoped to the pintopets_*
  # modules). Created out of band (never in git); see docs/environments.md.
  apiKeySecret: pintopets-opsapi

# One ExternalSecret per entry; ESO copies every key under the Vault path into a
# Secret named pintopets-<entry>, loaded into the web pod with envFrom. Vault key
# names must equal env var names (see .env.example). Empty until the app has
# secrets (M2: Google OAuth, Resend, TOTP key). Add an entry only once the Vault
# path exists: a missing path keeps the ExternalSecret unready and fails
# `helm --wait` (this is what blocked workerra's first deploy).
vaultStore: wslvault-backend
vaultSecrets: {}

# Plain, non-secret env.
extraEnv: {}

# Demo sign-in (one shared demo account) until real sign-in lands. The app
# refuses to start with it on prod (APP_ENV=prod).
demoAuth: false

# Uploaded photos. One RWO volume, so the web Deployment uses the Recreate
# strategy while this is enabled (Cloudflare R2 replaces it later).
media:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn
  mountPath: /data/media

ingress:
  enabled: true
  # TLS terminates on the wslproxy edge (lon1/lon2), which proxies plain HTTP to
  # the cluster ingress by Host header, so no cert-manager/tls block here.
  className: traefik

resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { cpu: 1000m, memory: 768Mi }

nodeSelector: {}
