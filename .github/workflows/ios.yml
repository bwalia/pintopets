name: iOS

on:
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit-test the iOS app
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project from project.yml
        run: xcodegen generate
      - name: Test on an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project PintoPets.xcodeproj -scheme PintoPets \
            -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -quiet
