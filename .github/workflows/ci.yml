name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://pintopets:pintopets@localhost:5432/pintopets
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
  # Shared demo sign-in for tests (never on prod; the app refuses it there).
  DEMO_AUTH: "true"
  MEDIA_DIR: /tmp/pintopets-media

jobs:
  ci:
    name: Lint, type-check, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pintopets
          POSTGRES_PASSWORD: pintopets
          POSTGRES_DB: pintopets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pintopets -d pintopets"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Helm chart lints and renders
        run: |
          helm lint deploy/helm/pintopets -f deploy/helm/pintopets/values-int.yaml
          helm template pintopets deploy/helm/pintopets -n int -f deploy/helm/pintopets/values-int.yaml --set image.tag=ci > /dev/null

      - name: Migrations are in sync with the schema
        run: pnpm db:check

      - name: Apply migrations and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @pintopets/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
