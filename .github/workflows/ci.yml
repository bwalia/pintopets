name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # OpsAPI with the pintopets plugin, started below from docker-compose.opsapi.yml.
  OPSAPI_URL: http://localhost:4042
  OPSAPI_NAMESPACE: pintopets
  # Test-only signing key for the session cookie (not a real secret).
  SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-000
  # Test-only 32-byte key (base64) for encrypting TOTP secrets.
  TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0wMDAwMDAwMDAwMDAwMDA=
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
  # Shared demo sign-in for tests (never on prod; the app refuses it there).
  DEMO_AUTH: "true"
  MEDIA_DIR: /tmp/pintopets-media

jobs:
  ci:
    name: Lint, type-check, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Helm chart lints and renders
        run: |
          helm lint deploy/helm/pintopets -f deploy/helm/pintopets/values-int.yaml
          helm template pintopets deploy/helm/pintopets -n int -f deploy/helm/pintopets/values-int.yaml --set image.tag=ci > /dev/null

      - name: OpsAPI plugin loads in the OpsAPI version int runs
        run: docker build -f Dockerfile.opsapi-plugin -t pintopets-opsapi-plugin:ci .

      - name: Start OpsAPI with the pintopets plugin
        run: |
          set -euo pipefail
          docker compose -f docker-compose.opsapi.yml up -d --wait opsapi
          docker compose -f docker-compose.opsapi.yml up bootstrap
          key=$(docker compose -f docker-compose.opsapi.yml logs --no-log-prefix bootstrap | grep '^OPSAPI_API_KEY=' | tail -1 | cut -d= -f2)
          [ -n "$key" ] || { echo "::error::bootstrap printed no API key"; exit 1; }
          echo "::add-mask::$key"
          echo "OPSAPI_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @pintopets/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: OpsAPI logs on failure
        if: failure()
        run: docker compose -f docker-compose.opsapi.yml logs --tail=200 opsapi migrate || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
