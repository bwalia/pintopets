name: PintoPets
options:
  bundleIdPrefix: app.pintopets
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PintoPets:
    type: application
    platform: iOS
    sources:
      - PintoPets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pintopets.ios
        PRODUCT_NAME: PintoPets
        INFOPLIST_FILE: PintoPets/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
  PintoPetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PintoPetsTests
    dependencies:
      - target: PintoPets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pintopets.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PintoPets.app/PintoPets"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PintoPets:
    build:
      targets:
        PintoPets: all
        PintoPetsTests: [test]
    test:
      targets:
        - PintoPetsTests
